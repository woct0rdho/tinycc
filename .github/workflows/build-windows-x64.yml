name: build Windows x64 binary

on:
  workflow_dispatch:
  push:
    branches: [ mob ]
    tags: [ "v*" ]
  pull_request:
    branches: [ mob ]

permissions:
  contents: read

concurrency:
  group: windows-x64-binary-${{ github.ref }}
  cancel-in-progress: true

env:
  NVIDIA_DRIVER_URL: https://us.download.nvidia.com/Windows/572.70/572.70-desktop-win10-win11-64bit-international-dch-whql.exe
  NVIDIA_DRIVER_SHA256: FD81090A6DFE9DFE44E6862F0E29688319E25D62F4D9220A71C2335FD7B708DA

jobs:
  build-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: build native x64 TCC
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" amd64
        call build-tcc.bat -c cl -t x86_64

    # These versions match the DLLs used by v0.9.28rc-05bb793.
    # Extracting the DLLs avoids replacing Python versions in the runner toolcache.
    - name: generate x64 Python definitions
      shell: pwsh
      run: |
        $packages = @(
          @{
            Version = "3.9.13"
            Name = "python-3.9.13-embed-amd64.zip"
            Hash = "938A1F3B80D580320836260612084D74CE094A261E36F9FF3AC7B9463DF5F5E4"
            Definitions = @("python3.dll=python3.def", "python39.dll=python39.def")
          },
          @{
            Version = "3.10.11"
            Name = "python-3.10.11-embed-amd64.zip"
            Hash = "608619F8619075629C9C69F361352A0DA6ED7E62F83A0E19C63E0EA32EB7629D"
            Definitions = @("python310.dll=python310.def")
          },
          @{
            Version = "3.11.9"
            Name = "python-3.11.9-embed-amd64.zip"
            Hash = "009D6BF7E3B2DDCA3D784FA09F90FE54336D5B60F0E0F305C37F400BF83CFD3B"
            Definitions = @("python311.dll=python311.def")
          },
          @{
            Version = "3.12.9"
            Name = "python-3.12.9-embed-amd64.zip"
            Hash = "615861FB801E8B04C847598DB4E1E46E4B046295017CAA37CB5486DDE72B5865"
            Definitions = @("python312.dll=python312.def")
          },
          @{
            Version = "3.13.2"
            Name = "python-3.13.2-amd64.zip"
            Hash = "C2C6ECCB91D9E7E4FFDEC334BDEE7507522E8EB14700BFCFB40C176C8A036282"
            Definitions = @("python313.dll=python313.def")
          },
          @{
            Version = "3.13.2"
            Name = "python-3.13.2t-amd64.zip"
            Hash = "4EB15A6264842292ABCC86C7B26DFDA3AE7E05CE2F54EA4FE7A8E110AE021F89"
            Definitions = @("python3t.dll=python3t.def", "python313t.dll=python313t.def")
          },
          @{
            Version = "3.14.1"
            Name = "python-3.14.1-amd64.zip"
            Hash = "46D6514446D0082B5C52961F468DF0210AF75633D57EB2594BB553A365FB59DD"
            Definitions = @("python314.dll=python314.def")
          },
          @{
            Version = "3.14.1"
            Name = "python-3.14.1t-amd64.zip"
            Hash = "1AF7D0B460846369D7F4AD28CF41750994F1CB6251DF8518B7CDA6F445B1B4A3"
            Definitions = @("python314t.dll=python314t.def")
          }
        )
        $downloadDirectory = Join-Path $env:RUNNER_TEMP "python-x64"
        New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null

        foreach ($package in $packages) {
          $archive = Join-Path $downloadDirectory $package.Name
          $extractDirectory = Join-Path $downloadDirectory $package.Name.Replace(".zip", "")
          $url = "https://www.python.org/ftp/python/$($package.Version)/$($package.Name)"
          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --retry-delay 5 `
            --silent `
            --show-error `
            --output $archive `
            $url
          if ($LASTEXITCODE) {
            throw "Failed to download $($package.Name)"
          }

          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $package.Hash) {
            throw "$($package.Name) checksum mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDirectory

          foreach ($mapping in $package.Definitions) {
            $dll, $definition = $mapping.Split("=")
            & .\win32\tcc.exe `
              -impdef (Join-Path $extractDirectory $dll) `
              -o (Join-Path "win32\lib" $definition)
            if ($LASTEXITCODE) {
              throw "Failed to generate $definition"
            }
          }
        }

    - name: generate x64 CUDA definition
      shell: pwsh
      run: |
        $driver = Join-Path $env:RUNNER_TEMP "nvidia-driver.exe"
        curl.exe --fail --location --retry 3 --silent --show-error --output $driver $env:NVIDIA_DRIVER_URL
        if ($LASTEXITCODE) { throw "Failed to download the NVIDIA driver" }

        $actualHash = (Get-FileHash $driver -Algorithm SHA256).Hash
        if ($actualHash -ne $env:NVIDIA_DRIVER_SHA256) {
          throw "NVIDIA driver checksum mismatch: $actualHash"
        }

        $driverFiles = Join-Path $env:RUNNER_TEMP "nvidia-driver"
        & "C:\Program Files\7-Zip\7z.exe" e -y $driver "Display.Driver\nvcuda_loader64.dll" "-o$driverFiles"
        if ($LASTEXITCODE) { throw "Failed to extract nvcuda_loader64.dll" }

        $cudaDll = Join-Path $driverFiles "nvcuda.dll"
        Move-Item (Join-Path $driverFiles "nvcuda_loader64.dll") $cudaDll
        & .\win32\tcc.exe -impdef $cudaDll -o win32\lib\cuda.def
        if ($LASTEXITCODE) { throw "Failed to generate cuda.def" }

    - name: verify x64 import definitions
      shell: pwsh
      run: |
        $expected = @(
          "cuda.def",
          "python3.def",
          "python39.def",
          "python310.def",
          "python311.def",
          "python312.def",
          "python313.def",
          "python313t.def",
          "python314.def",
          "python314t.def",
          "python3t.def"
        )
        foreach ($file in $expected) {
          $path = Join-Path "win32\lib" $file
          if (!(Test-Path $path)) { throw "Missing import definition: $path" }
        }
        if ((Get-Content win32\lib\cuda.def -TotalCount 1) -ne "LIBRARY nvcuda.dll") {
          throw "cuda.def has the wrong library name"
        }

    - name: bundle and smoke test x64
      id: package
      shell: pwsh
      run: |
        $version = (Get-Content VERSION -Raw).Trim()
        $revision = (git rev-parse --short=7 HEAD).Trim()
        $name = "tcc-$version-$revision-windows-x64"
        $stage = Join-Path $env:RUNNER_TEMP $name
        $lib = Join-Path $stage "lib"

        New-Item -ItemType Directory -Path $lib | Out-Null
        Copy-Item win32\tcc.exe, win32\libtcc.dll $stage
        Copy-Item win32\include $stage -Recurse
        Copy-Item win32\lib\libtcc1.a $lib
        Copy-Item win32\lib\*.def $lib

        $source = Join-Path $env:RUNNER_TEMP "smoke-test.c"
        $executable = Join-Path $env:RUNNER_TEMP "smoke-test.exe"
        Set-Content $source "int main(void) { return 0; }"
        & "$stage\tcc.exe" "-B$stage" $source -o $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test compilation failed" }
        & $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test executable failed" }

        $archive = Join-Path $PWD "$name.zip"
        Compress-Archive -Path "$stage\*" -DestinationPath $archive
        "name=$name" >> $env:GITHUB_OUTPUT
        "archive=$archive" >> $env:GITHUB_OUTPUT

    - name: upload x64 bundle
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.name }}
        path: ${{ steps.package.outputs.archive }}
        if-no-files-found: error
        archive: false
