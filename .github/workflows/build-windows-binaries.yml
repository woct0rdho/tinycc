name: build Windows binaries

on:
  workflow_dispatch:
  push:
    branches: [ mob ]
    tags: [ "v*" ]
  pull_request:
    branches: [ mob ]

permissions:
  contents: read

concurrency:
  group: windows-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  NVIDIA_X64_DRIVER_URL: https://us.download.nvidia.com/Windows/572.70/572.70-desktop-win10-win11-64bit-international-dch-whql.exe
  NVIDIA_X64_DRIVER_SHA256: FD81090A6DFE9DFE44E6862F0E29688319E25D62F4D9220A71C2335FD7B708DA
  CUDA_ARM64_TOOLKIT_URL: https://packages.nvidia.com/prerelease/cuda/13.4.0/local_installers/cuda_13.4.0_windows_arm64.exe
  CUDA_ARM64_TOOLKIT_SHA256: A1F68C81160B16D519C4087788B9C07DE41306C3F1B872471CEEE0996621374D

jobs:
  generate-import-definitions:
    name: generate Python import definitions
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: build definition generator
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" amd64
        call build-tcc.bat -c cl -t x86_64

    # These versions match the DLLs used by v0.9.28rc-05bb793.
    - name: set up Python 3.9
      uses: actions/setup-python@v7
      with:
        python-version: "3.9.13"
        architecture: x64
    - name: generate Python 3.9 definitions
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python3.dll" -o win32\lib\python3.def
        if ($LASTEXITCODE) { throw "Failed to generate python3.def" }
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python39.dll" -o win32\lib\python39.def
        if ($LASTEXITCODE) { throw "Failed to generate python39.def" }

    - name: set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10.11"
        architecture: x64
    - name: generate Python 3.10 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python310.dll" -o win32\lib\python310.def
        if ($LASTEXITCODE) { throw "Failed to generate python310.def" }

    - name: set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11.9"
        architecture: x64
    - name: generate Python 3.11 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python311.dll" -o win32\lib\python311.def
        if ($LASTEXITCODE) { throw "Failed to generate python311.def" }

    - name: set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12.9"
        architecture: x64
    - name: generate Python 3.12 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python312.dll" -o win32\lib\python312.def
        if ($LASTEXITCODE) { throw "Failed to generate python312.def" }

    - name: set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13.2"
        architecture: x64
    - name: generate Python 3.13 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python313.dll" -o win32\lib\python313.def
        if ($LASTEXITCODE) { throw "Failed to generate python313.def" }

    - name: set up free-threaded Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13.2t"
        architecture: x64
    - name: generate free-threaded Python 3.13 definitions
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python3t.dll" -o win32\lib\python3t.def
        if ($LASTEXITCODE) { throw "Failed to generate python3t.def" }
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python313t.dll" -o win32\lib\python313t.def
        if ($LASTEXITCODE) { throw "Failed to generate python313t.def" }

    - name: set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14.1"
        architecture: x64
    - name: generate Python 3.14 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python314.dll" -o win32\lib\python314.def
        if ($LASTEXITCODE) { throw "Failed to generate python314.def" }

    - name: set up free-threaded Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14.1t"
        architecture: x64
    - name: generate free-threaded Python 3.14 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python314t.dll" -o win32\lib\python314t.def
        if ($LASTEXITCODE) { throw "Failed to generate python314t.def" }

    - name: verify import definitions
      shell: pwsh
      run: |
        $expected = @(
          "python3.def",
          "python39.def",
          "python310.def",
          "python311.def",
          "python312.def",
          "python313.def",
          "python313t.def",
          "python314.def",
          "python314t.def",
          "python3t.def"
        )
        foreach ($file in $expected) {
          $path = Join-Path "win32\lib" $file
          if (!(Test-Path $path)) { throw "Missing import definition: $path" }
        }

    - name: upload import definitions
      uses: actions/upload-artifact@v7
      with:
        name: windows-python-import-definitions
        path: win32/lib/python*.def
        if-no-files-found: error
        retention-days: 1

  build:
    name: build ${{ matrix.arch }}
    needs: generate-import-definitions
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: windows-2025
          vcvars: amd64
          target: x86_64
        - arch: arm64
          runner: windows-11-arm
          vcvars: amd64_arm64
          target: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4

    - name: download import definitions
      uses: actions/download-artifact@v8
      with:
        name: windows-python-import-definitions
        path: win32/lib

    - name: build TCC
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }}
        call build-tcc.bat -c cl -t ${{ matrix.target }}

    - name: generate x64 CUDA definition
      if: matrix.arch == 'x64'
      shell: pwsh
      run: |
        $driver = Join-Path $env:RUNNER_TEMP "nvidia-driver.exe"
        curl.exe --fail --location --retry 3 --silent --show-error --output $driver $env:NVIDIA_X64_DRIVER_URL
        if ($LASTEXITCODE) { throw "Failed to download the NVIDIA driver" }

        $actualHash = (Get-FileHash $driver -Algorithm SHA256).Hash
        if ($actualHash -ne $env:NVIDIA_X64_DRIVER_SHA256) {
          throw "NVIDIA driver checksum mismatch: $actualHash"
        }

        $driverFiles = Join-Path $env:RUNNER_TEMP "nvidia-driver"
        & "C:\Program Files\7-Zip\7z.exe" e -y $driver "Display.Driver\nvcuda_loader64.dll" "-o$driverFiles"
        if ($LASTEXITCODE) { throw "Failed to extract nvcuda_loader64.dll" }

        # The installed driver names this DLL nvcuda.dll; -impdef uses its input
        # filename for the LIBRARY directive.
        $cudaDll = Join-Path $driverFiles "nvcuda.dll"
        Move-Item (Join-Path $driverFiles "nvcuda_loader64.dll") $cudaDll
        & .\win32\tcc.exe -impdef $cudaDll -o win32\lib\cuda.def
        if ($LASTEXITCODE) { throw "Failed to generate cuda.def" }

    - name: cache CUDA 13.4 ARM64 installer
      if: matrix.arch == 'arm64'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}\cuda-installer
        key: cuda-13.4.0-windows-arm64-${{ env.CUDA_ARM64_TOOLKIT_SHA256 }}

    - name: download CUDA Toolkit 13.4 for ARM64
      if: matrix.arch == 'arm64'
      shell: pwsh
      run: |
        $directory = Join-Path $env:RUNNER_TEMP "cuda-installer"
        $installer = Join-Path $directory "cuda_13.4.0_windows_arm64.exe"
        $partial = "$installer.part"
        $expectedLength = 3835939064
        New-Item -ItemType Directory -Force -Path $directory | Out-Null

        if ((Test-Path $installer) -and (Get-Item $installer).Length -ne $expectedLength) {
          Write-Warning "Discarding incomplete cached CUDA installer"
          Remove-Item $installer -Force
        }
        if ((Test-Path $partial) -and (Get-Item $partial).Length -gt $expectedLength) {
          Remove-Item $partial -Force
        }
        if (!(Test-Path $installer)) {
          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --retry-delay 10 `
            --continue-at - `
            --output $partial `
            $env:CUDA_ARM64_TOOLKIT_URL
          if ($LASTEXITCODE) {
            throw "CUDA installer download failed with curl exit code $LASTEXITCODE"
          }
          Move-Item $partial $installer
        }

        $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash
        if ($actualHash -ne $env:CUDA_ARM64_TOOLKIT_SHA256) {
          throw "CUDA ARM64 installer checksum mismatch: $actualHash"
        }

    - name: generate ARM64 CUDA definition
      if: matrix.arch == 'arm64'
      shell: pwsh
      run: |
        # CUDA 13.4 no longer bundles the Windows display driver. Its native
        # ARM64 cuda.lib loader is the available source of Driver API symbols.
        $installer = Join-Path $env:RUNNER_TEMP "cuda-installer\cuda_13.4.0_windows_arm64.exe"
        $extractDirectory = Join-Path $env:RUNNER_TEMP "cuda-arm64"
        & "C:\Program Files\7-Zip\7z.exe" e -y `
          $installer `
          "cuda_cudart\cudart\lib\arm64\cuda.lib" `
          "-o$extractDirectory"
        if ($LASTEXITCODE) { throw "Failed to extract the ARM64 CUDA loader library" }

        $cudaLibrary = Join-Path $extractDirectory "cuda.lib"
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsInstall = (& $vswhere -latest -property installationPath | Select-Object -First 1)
        $dumpbin = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") `
          -Recurse -Filter dumpbin.exe |
          Where-Object FullName -Match "bin\\Host(arm64|x64)\\arm64\\dumpbin.exe$" |
          Sort-Object FullName -Descending |
          Select-Object -First 1
        if (!$dumpbin) { throw "ARM64 dumpbin.exe was not found" }

        $headers = & $dumpbin.FullName /headers $cudaLibrary
        if ($LASTEXITCODE) { throw "Failed to inspect the ARM64 CUDA loader library" }
        if (($headers | Out-String) -notmatch "AA64 machine \(ARM64\)") {
          throw "CUDA loader library is not ARM64"
        }

        $members = & $dumpbin.FullName /linkermember:2 $cudaLibrary
        if ($LASTEXITCODE) { throw "Failed to read ARM64 CUDA loader symbols" }
        $symbols = @(
          $members | ForEach-Object {
            if ($_ -cmatch "^\s+[0-9A-F]+\s+(cu[A-Z][A-Za-z0-9_]+)$") {
              $Matches[1]
            }
          } | Sort-Object -Unique
        )
        if ($symbols.Count -lt 700) {
          throw "Only $($symbols.Count) CUDA Driver API symbols were found"
        }

        $definition = @("LIBRARY nvcuda.dll", "", "EXPORTS") + $symbols
        Set-Content win32\lib\cuda.def $definition -Encoding ascii

    - name: bundle and smoke test
      id: package
      shell: pwsh
      env:
        TARGET_ARCH: ${{ matrix.arch }}
      run: |
        $version = (Get-Content VERSION -Raw).Trim()
        $revision = (git rev-parse --short=7 HEAD).Trim()
        $name = "tcc-$version-$revision-windows-$env:TARGET_ARCH"
        $stage = Join-Path $env:RUNNER_TEMP $name
        $lib = Join-Path $stage "lib"

        New-Item -ItemType Directory -Path $lib | Out-Null
        Copy-Item win32\tcc.exe, win32\libtcc.dll $stage
        Copy-Item win32\include $stage -Recurse
        Copy-Item win32\lib\libtcc1.a $lib
        Copy-Item win32\lib\*.def $lib

        $expectedDefinitions = @(
          "cuda.def",
          "gdi32.def",
          "kernel32.def",
          "msvcrt.def",
          "python3.def",
          "python39.def",
          "python310.def",
          "python311.def",
          "python312.def",
          "python313.def",
          "python313t.def",
          "python314.def",
          "python314t.def",
          "python3t.def",
          "user32.def"
        )
        foreach ($file in $expectedDefinitions) {
          $path = Join-Path $lib $file
          if (!(Test-Path $path)) { throw "Missing bundled definition: $path" }
        }

        $source = Join-Path $env:RUNNER_TEMP "smoke-test.c"
        $executable = Join-Path $env:RUNNER_TEMP "smoke-test.exe"
        Set-Content $source "int main(void) { return 0; }"
        & "$stage\tcc.exe" -B$stage $source -o $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test compilation failed" }
        & $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test executable failed" }

        $archive = Join-Path $PWD "$name.zip"
        Compress-Archive -Path "$stage\*" -DestinationPath $archive
        "name=$name" >> $env:GITHUB_OUTPUT
        "archive=$archive" >> $env:GITHUB_OUTPUT

    - name: upload bundle
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.name }}
        path: ${{ steps.package.outputs.archive }}
        if-no-files-found: error
        archive: false
