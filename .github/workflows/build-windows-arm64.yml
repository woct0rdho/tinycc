name: build Windows ARM64 binary

on:
  workflow_dispatch:
  push:
    branches: [ mob ]
    tags: [ "v*" ]
  pull_request:
    branches: [ mob ]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: windows-arm64-binary-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDART_URL: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.8.90-archive.zip
  CUDART_SHA256: 4A39058FD8519444A81CFC7AE055D136F48D1A31FFA41AE255B35B2EDD61E13B

jobs:
  build-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        # Always checkout a detached HEAD. This avoids hardcoding the branch name in the built tcc.
        ref: ${{ github.sha }}

    - name: build native ARM64 TCC bootstrap with MSVC
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\Common7\Tools\VsDevCmd.bat" -host_arch=arm64 -arch=arm64
        if /I not "%VSCMD_ARG_HOST_ARCH%"=="arm64" exit /B 1
        if /I not "%VSCMD_ARG_TGT_ARCH%"=="arm64" exit /B 1
        call build-tcc.bat -c cl -t arm64

    - name: rebuild native ARM64 TCC with TCC
      shell: cmd
      run: |
        cd win32
        set "bootstrap=%RUNNER_TEMP%\tcc-bootstrap-arm64"
        if exist "%bootstrap%" rmdir /Q/S "%bootstrap%"
        mkdir "%bootstrap%" || exit /B 1
        copy /Y tcc.exe "%bootstrap%\tcc.exe" >nul || exit /B 1
        copy /Y libtcc.dll "%bootstrap%\libtcc.dll" >nul || exit /B 1
        xcopy /E/I/Q/Y include "%bootstrap%\include" >nul || exit /B 1
        xcopy /E/I/Q/Y lib "%bootstrap%\lib" >nul || exit /B 1
        call build-tcc.bat -clean || exit /B 1
        call build-tcc.bat -c "%bootstrap%\tcc.exe" -t arm64

    # CPython first published official Windows ARM64 binaries in 3.11.
    # Extracting the DLLs avoids replacing Python versions in the runner toolcache.
    - name: generate ARM64 Python definitions
      shell: pwsh
      run: |
        $packages = @(
          @{
            Version = "3.11.9"
            Name = "python-3.11.9-embed-arm64.zip"
            Hash = "1A6DAE49D15320270A7141F93B574FF7686A7A526EFA65E63DDBEBF9B409929A"
            Definitions = @("python3.dll=python3.def", "python311.dll=python311.def")
          },
          @{
            Version = "3.12.9"
            Name = "python-3.12.9-embed-arm64.zip"
            Hash = "C7D4D2A8E7E36263F34659B1CF70E7691F0572DA3E4D4E583B3334555D978877"
            Definitions = @("python312.dll=python312.def")
          },
          @{
            Version = "3.13.2"
            Name = "python-3.13.2-arm64.zip"
            Hash = "7B23DF9B2F3E8B7E10D8278406B37A0D53A73165AC7566748B1F2EE3A24580A5"
            Definitions = @("python313.dll=python313.def")
          },
          @{
            Version = "3.13.2"
            Name = "python-3.13.2t-arm64.zip"
            Hash = "AF30D88C2F6163A9B76C9B52C37DF59DBA43A51A755FFA6674C2A1DFF786F81B"
            Definitions = @("python3t.dll=python3t.def", "python313t.dll=python313t.def")
          },
          @{
            Version = "3.14.1"
            Name = "python-3.14.1-arm64.zip"
            Hash = "BE97DCA16525FCA8FD07CD4CA0AF646974C58D179EEB6502A8E9B1E793E8D31F"
            Definitions = @("python314.dll=python314.def")
          },
          @{
            Version = "3.14.1"
            Name = "python-3.14.1t-arm64.zip"
            Hash = "29D675D7889C9BCE957CC386D8B7D50C5492A7CE96EDF8346803952960E6E37B"
            Definitions = @("python314t.dll=python314t.def")
          }
        )
        $downloadDirectory = Join-Path $env:RUNNER_TEMP "python-arm64"
        New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null

        foreach ($package in $packages) {
          $archive = Join-Path $downloadDirectory $package.Name
          $extractDirectory = Join-Path $downloadDirectory $package.Name.Replace(".zip", "")
          $url = "https://www.python.org/ftp/python/$($package.Version)/$($package.Name)"
          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --retry-delay 5 `
            --silent `
            --show-error `
            --output $archive `
            $url
          if ($LASTEXITCODE) {
            throw "Failed to download $($package.Name)"
          }

          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $package.Hash) {
            throw "$($package.Name) checksum mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDirectory

          foreach ($mapping in $package.Definitions) {
            $dll, $definition = $mapping.Split("=")
            & .\win32\tcc.exe `
              -impdef (Join-Path $extractDirectory $dll) `
              -o (Join-Path "win32\lib" $definition)
            if ($LASTEXITCODE) {
              throw "Failed to generate $definition"
            }
          }
        }

    - name: generate ARM64 CUDA definition
      shell: pwsh
      run: |
        # A .def file contains only the DLL name and architecture-independent export names,
        # so the x64 CUDA import library is equivalent to ARM64 for this purpose.
        # Replace it with an ARM64 package when NVIDIA provides one.
        $archive = Join-Path $env:RUNNER_TEMP "cuda_cudart-windows-x86_64-12.8.90-archive.zip"
        $extractDirectory = Join-Path $env:RUNNER_TEMP "cuda-cudart-x64"
        curl.exe `
          --fail `
          --location `
          --retry 5 `
          --retry-all-errors `
          --retry-delay 5 `
          --silent `
          --show-error `
          --output $archive `
          $env:CUDART_URL
        if ($LASTEXITCODE) { throw "Failed to download CUDA Runtime 12.8.90" }

        $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash
        if ($actualHash -ne $env:CUDART_SHA256) {
          throw "CUDA Runtime checksum mismatch: $actualHash"
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $extractDirectory
        $cudaLibrary = Join-Path $extractDirectory `
          "cuda_cudart-windows-x86_64-12.8.90-archive\lib\x64\cuda.lib"

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsInstall = (& $vswhere -latest -property installationPath | Select-Object -First 1)
        $dumpbin = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") `
          -Recurse -Filter dumpbin.exe |
          Where-Object FullName -Match "bin\\Hostarm64\\arm64\\dumpbin.exe$" |
          Sort-Object FullName -Descending |
          Select-Object -First 1
        if (!$dumpbin) { throw "Native ARM64 dumpbin.exe was not found" }

        $headers = & $dumpbin.FullName /headers $cudaLibrary
        if ($LASTEXITCODE) { throw "Failed to inspect the CUDA loader library" }
        if (($headers | Out-String) -notmatch "8664 machine \(x64\)") {
          throw "CUDA loader library is not x64"
        }

        $members = & $dumpbin.FullName /linkermember:2 $cudaLibrary
        if ($LASTEXITCODE) { throw "Failed to read CUDA loader symbols" }
        $symbols = @(
          $members | ForEach-Object {
            if ($_ -cmatch "^\s+[0-9A-F]+\s+(cu[A-Z][A-Za-z0-9_]+)$") {
              $Matches[1]
            }
          } | Sort-Object -Unique
        )
        if ($symbols.Count -ne 688) {
          throw "Expected 688 CUDA Driver API symbols, found $($symbols.Count)"
        }

        $definition = @("LIBRARY nvcuda.dll", "", "EXPORTS") + $symbols
        Set-Content win32\lib\cuda.def $definition -Encoding ascii

    - name: verify ARM64 import definitions
      shell: pwsh
      run: |
        $expected = @(
          "cuda.def",
          "python3.def",
          "python311.def",
          "python312.def",
          "python313.def",
          "python313t.def",
          "python314.def",
          "python314t.def",
          "python3t.def"
        )
        foreach ($file in $expected) {
          $path = Join-Path "win32\lib" $file
          if (!(Test-Path $path)) { throw "Missing import definition: $path" }
        }
        if ((Get-Content win32\lib\cuda.def -TotalCount 1) -ne "LIBRARY nvcuda.dll") {
          throw "cuda.def has the wrong library name"
        }

    - name: bundle and smoke test ARM64
      id: package
      shell: pwsh
      run: |
        $version = (Get-Content VERSION -Raw).Trim()
        $revision = (git rev-parse --short=7 HEAD).Trim()
        $name = "tcc-$version-$revision-windows-arm64"
        $stage = Join-Path $env:RUNNER_TEMP $name
        $lib = Join-Path $stage "lib"

        New-Item -ItemType Directory -Path $lib | Out-Null
        Copy-Item win32\tcc.exe, win32\libtcc.dll $stage
        Copy-Item win32\include $stage -Recurse
        Copy-Item win32\lib\libtcc1.a $lib
        Copy-Item win32\lib\*.def $lib

        $source = Join-Path $env:RUNNER_TEMP "smoke-test.c"
        $executable = Join-Path $env:RUNNER_TEMP "smoke-test.exe"
        Set-Content $source "int main(void) { return 0; }"
        & "$stage\tcc.exe" "-B$stage" $source -o $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test compilation failed" }
        & $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test executable failed" }

        $commitTimestamp = ([DateTimeOffset](git show -s --format=%cI HEAD)).UtcDateTime
        # ZIP timestamps have no timezone, so we store the timestamp in UTC into LastWriteTime regardless of
        # what timezone LastWriteTime actually represents, then let Compress-Archive read it.
        $commitTimestamp = [DateTime]::SpecifyKind($commitTimestamp, [DateTimeKind]::Unspecified)
        Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object {
          $_.LastWriteTime = $commitTimestamp
        }

        $archivePaths = @(
          Get-ChildItem -Path "$stage\*" |
            Sort-Object -Property FullName |
            Select-Object -ExpandProperty FullName
        )
        $archive = Join-Path $PWD "$name.zip"
        Compress-Archive -Path $archivePaths -DestinationPath $archive
        "name=$name" >> $env:GITHUB_OUTPUT
        "archive=$archive" >> $env:GITHUB_OUTPUT

    - uses: actions/attest@v4
      with:
        subject-path: ${{ steps.package.outputs.archive }}

    - name: upload ARM64 bundle
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.name }}
        path: ${{ steps.package.outputs.archive }}
        if-no-files-found: error
        archive: false
