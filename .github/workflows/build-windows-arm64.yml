name: build Windows ARM64 binary

on:
  workflow_dispatch:
  push:
    branches: [ mob ]
    tags: [ "v*" ]
  pull_request:
    branches: [ mob ]

permissions:
  contents: read

concurrency:
  group: windows-arm64-binary-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_TOOLKIT_URL: https://packages.nvidia.com/prerelease/cuda/13.4.0/local_installers/cuda_13.4.0_windows_arm64.exe
  CUDA_TOOLKIT_SHA256: A1F68C81160B16D519C4087788B9C07DE41306C3F1B872471CEEE0996621374D

jobs:
  build-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: build native ARM64 TCC
      shell: cmd
      run: |
        cd win32
        for /f "delims=" %%i in ('vswhere.exe -latest -property installationPath') do call "%%i\Common7\Tools\VsDevCmd.bat" -host_arch=arm64 -arch=arm64
        if /I not "%VSCMD_ARG_HOST_ARCH%"=="arm64" exit /B 1
        if /I not "%VSCMD_ARG_TGT_ARCH%"=="arm64" exit /B 1
        call build-tcc.bat -c cl -t arm64

    # CPython first published official Windows ARM64 binaries in 3.11.
    - name: set up ARM64 Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11.9"
        architecture: arm64
    - name: generate ARM64 Python 3.11 definitions
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python3.dll" -o win32\lib\python3.def
        if ($LASTEXITCODE) { throw "Failed to generate python3.def" }
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python311.dll" -o win32\lib\python311.def
        if ($LASTEXITCODE) { throw "Failed to generate python311.def" }

    - name: set up ARM64 Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12.9"
        architecture: arm64
    - name: generate ARM64 Python 3.12 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python312.dll" -o win32\lib\python312.def
        if ($LASTEXITCODE) { throw "Failed to generate python312.def" }

    - name: set up ARM64 Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13.2"
        architecture: arm64
    - name: generate ARM64 Python 3.13 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python313.dll" -o win32\lib\python313.def
        if ($LASTEXITCODE) { throw "Failed to generate python313.def" }

    - name: set up free-threaded ARM64 Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13.2t"
        architecture: arm64
    - name: generate free-threaded ARM64 Python 3.13 definitions
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python3t.dll" -o win32\lib\python3t.def
        if ($LASTEXITCODE) { throw "Failed to generate python3t.def" }
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python313t.dll" -o win32\lib\python313t.def
        if ($LASTEXITCODE) { throw "Failed to generate python313t.def" }

    - name: set up ARM64 Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14.1"
        architecture: arm64
    - name: generate ARM64 Python 3.14 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python314.dll" -o win32\lib\python314.def
        if ($LASTEXITCODE) { throw "Failed to generate python314.def" }

    - name: set up free-threaded ARM64 Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14.1t"
        architecture: arm64
    - name: generate free-threaded ARM64 Python 3.14 definition
      shell: pwsh
      run: |
        & .\win32\tcc.exe -impdef "$env:pythonLocation\python314t.dll" -o win32\lib\python314t.def
        if ($LASTEXITCODE) { throw "Failed to generate python314t.def" }

    - name: cache CUDA 13.4 ARM64 installer
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}\cuda-installer
        key: cuda-13.4.0-windows-arm64-${{ env.CUDA_TOOLKIT_SHA256 }}

    - name: download CUDA Toolkit 13.4 for ARM64
      shell: pwsh
      run: |
        $directory = Join-Path $env:RUNNER_TEMP "cuda-installer"
        $installer = Join-Path $directory "cuda_13.4.0_windows_arm64.exe"
        $partial = "$installer.part"
        $expectedLength = 3835939064
        New-Item -ItemType Directory -Force -Path $directory | Out-Null

        if ((Test-Path $installer) -and (Get-Item $installer).Length -ne $expectedLength) {
          Write-Warning "Discarding incomplete cached CUDA installer"
          Remove-Item $installer -Force
        }
        if ((Test-Path $partial) -and (Get-Item $partial).Length -gt $expectedLength) {
          Remove-Item $partial -Force
        }
        if (!(Test-Path $installer)) {
          curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-all-errors `
            --retry-delay 10 `
            --continue-at - `
            --output $partial `
            $env:CUDA_TOOLKIT_URL
          if ($LASTEXITCODE) {
            throw "CUDA installer download failed with curl exit code $LASTEXITCODE"
          }
          Move-Item $partial $installer
        }

        $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash
        if ($actualHash -ne $env:CUDA_TOOLKIT_SHA256) {
          throw "CUDA ARM64 installer checksum mismatch: $actualHash"
        }

    - name: generate ARM64 CUDA definition
      shell: pwsh
      run: |
        # CUDA 13.4 no longer bundles the Windows display driver. Its native
        # ARM64 cuda.lib loader is the available source of Driver API symbols.
        $installer = Join-Path $env:RUNNER_TEMP "cuda-installer\cuda_13.4.0_windows_arm64.exe"
        $extractDirectory = Join-Path $env:RUNNER_TEMP "cuda-arm64"
        & "C:\Program Files\7-Zip\7z.exe" e -y `
          $installer `
          "cuda_cudart\cudart\lib\arm64\cuda.lib" `
          "-o$extractDirectory"
        if ($LASTEXITCODE) { throw "Failed to extract the ARM64 CUDA loader library" }

        $cudaLibrary = Join-Path $extractDirectory "cuda.lib"
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsInstall = (& $vswhere -latest -property installationPath | Select-Object -First 1)
        $dumpbin = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") `
          -Recurse -Filter dumpbin.exe |
          Where-Object FullName -Match "bin\\Hostarm64\\arm64\\dumpbin.exe$" |
          Sort-Object FullName -Descending |
          Select-Object -First 1
        if (!$dumpbin) { throw "Native ARM64 dumpbin.exe was not found" }

        $headers = & $dumpbin.FullName /headers $cudaLibrary
        if ($LASTEXITCODE) { throw "Failed to inspect the ARM64 CUDA loader library" }
        if (($headers | Out-String) -notmatch "AA64 machine \(ARM64\)") {
          throw "CUDA loader library is not ARM64"
        }

        $members = & $dumpbin.FullName /linkermember:2 $cudaLibrary
        if ($LASTEXITCODE) { throw "Failed to read ARM64 CUDA loader symbols" }
        $symbols = @(
          $members | ForEach-Object {
            if ($_ -cmatch "^\s+[0-9A-F]+\s+(cu[A-Z][A-Za-z0-9_]+)$") {
              $Matches[1]
            }
          } | Sort-Object -Unique
        )
        if ($symbols.Count -lt 700) {
          throw "Only $($symbols.Count) CUDA Driver API symbols were found"
        }

        $definition = @("LIBRARY nvcuda.dll", "", "EXPORTS") + $symbols
        Set-Content win32\lib\cuda.def $definition -Encoding ascii

    - name: verify ARM64 import definitions
      shell: pwsh
      run: |
        $expected = @(
          "cuda.def",
          "python3.def",
          "python311.def",
          "python312.def",
          "python313.def",
          "python313t.def",
          "python314.def",
          "python314t.def",
          "python3t.def"
        )
        foreach ($file in $expected) {
          $path = Join-Path "win32\lib" $file
          if (!(Test-Path $path)) { throw "Missing import definition: $path" }
        }
        foreach ($unsupported in @("python39.def", "python310.def")) {
          if (Test-Path (Join-Path "win32\lib" $unsupported)) {
            throw "Unexpected non-ARM64 definition: $unsupported"
          }
        }

    - name: bundle and smoke test ARM64
      id: package
      shell: pwsh
      run: |
        $version = (Get-Content VERSION -Raw).Trim()
        $revision = (git rev-parse --short=7 HEAD).Trim()
        $name = "tcc-$version-$revision-windows-arm64"
        $stage = Join-Path $env:RUNNER_TEMP $name
        $lib = Join-Path $stage "lib"

        New-Item -ItemType Directory -Path $lib | Out-Null
        Copy-Item win32\tcc.exe, win32\libtcc.dll $stage
        Copy-Item win32\include $stage -Recurse
        Copy-Item win32\lib\libtcc1.a $lib
        Copy-Item win32\lib\*.def $lib

        $source = Join-Path $env:RUNNER_TEMP "smoke-test.c"
        $executable = Join-Path $env:RUNNER_TEMP "smoke-test.exe"
        Set-Content $source "int main(void) { return 0; }"
        & "$stage\tcc.exe" -B$stage $source -o $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test compilation failed" }
        & $executable
        if ($LASTEXITCODE) { throw "TCC smoke-test executable failed" }

        $archive = Join-Path $PWD "$name.zip"
        Compress-Archive -Path "$stage\*" -DestinationPath $archive
        "name=$name" >> $env:GITHUB_OUTPUT
        "archive=$archive" >> $env:GITHUB_OUTPUT

    - name: upload ARM64 bundle
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.name }}
        path: ${{ steps.package.outputs.archive }}
        if-no-files-found: error
        archive: false
